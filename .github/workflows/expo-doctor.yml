# 🔗 連結：
# 來源檔案：https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/expo-doctor.yml

# ✍️ 說明：
# 這個 workflow 會執行 expo doctor 指令，檢查專案相依套件是否與目前使用的 Expo SDK 版本一致。
# 可以從專案的 Actions 分頁手動觸發。
# 也會在 pull request 與推送到 main/master 分支時執行，但只有 `package.json` 或 `pnpm-lock.yaml` 被變更時才會執行。

# 🚨 必要的 GITHUB SECRETS：無

name: Expo Doctor (expo)

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read
  pull-requests: write

jobs:
  doctor:
    name: Expo Doctor (expo)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Run prebuild
        run: pnpm run prebuild

      - name: 🚑 Run Doctor Checks
        run: |
          chmod +x .github/scripts/expo-doctor.sh
          rm -rf ios android
          .github/scripts/expo-doctor.sh

      - name: Add doctor report as comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: expo-doctor
          path: .expo/expo-doctor.md
