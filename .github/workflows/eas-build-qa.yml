# 🔗 連結：
# 來源檔案：https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/eas-build-qa.yml
# Starter 發版流程：https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ 說明：
# 這個 workflow 用來觸發 QA 環境的 EAS build。
# 每次 repo 發布 GitHub release 時會執行，也可以從 Actions 分頁手動觸發。
# 這個 workflow 會使用 ./actions/eas-build action，以 staging env 觸發 EAS build。

# 🚨 必要的 GITHUB SECRETS：
#         - EXPO_TOKEN：用來向 EAS 驗證身分的 Expo token
#         - 可從 https://expo.dev/settings/access-tokens 取得

name: EAS QA Build (Android & IOS) (EAS)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  Build:
    name: EAS QA Build (Android & IOS) (EAS)
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: ⏱️ EAS Build
        uses: ./.github/actions/eas-build
        with:
          APP_ENV: staging
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
          IOS: false # TODO: iOS 帳號準備好後改為 true
