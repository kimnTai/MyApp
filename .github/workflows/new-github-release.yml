# 🔗 連結：
# 來源檔案：https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/new-github-release.yml
# Starter 發版流程：https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ 說明：
# new app version workflow 成功執行後，會自動觸發這個 workflow。
# 它會使用新的 app 版本與 release notes 建立新的 GitHub release。

# 🚨 必要的 GITHUB SECRETS：無

name: New GitHub Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: New GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏃‍♂️Create A Draft Github Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          draft: false
